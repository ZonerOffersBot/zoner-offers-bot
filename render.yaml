services:
  - type: web
    name: telegram-deal-bot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python -m compileall -q . && python -c "import bot, runner, main; print('Zoner import smoke test: OK')"
    startCommand: python main.py
    healthCheckPath: /health
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: WEBHOOK_URL
        sync: false
      - key: ADMIN_IDS
        sync: false
      - key: ADMIN_ID
        sync: false
      - key: CHANNEL_ID
        sync: false
      - key: CHANNEL_URL
        value: https://t.me/zoneroffers
      - key: DB_FILE
        sync: false
      - key: GROUP_ID
        sync: false
      - key: GROUP_URL
        sync: false
      - key: SECOND_CHANNEL_URL
        value: https://t.me/offerleloturant
      - key: POST_CHANNELS
        value: "@zoneroffers,@offerleloturant"
      - key: AUTO_POST
        value: "1"
      - key: SCAN_SECONDS
        value: "900"
      - key: MIN_DEAL_SCORE
        value: "45"
      - key: PYTHON_VERSION
        value: "3.11.9"
