services:
  - type: web
    name: zoner-offers-bot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python runner.py
    healthCheckPath: /
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_ID
        sync: false
      - key: CHANNEL_ID
        sync: false
      - key: GROUP_ID
        sync: false
      - key: GROUP_URL
        sync: false
      - key: SECOND_CHANNEL_URL
        value: https://t.me/offerleloturant
      - key: POST_CHANNELS
        value: "@zoneroffers,@offerleloturant"
      - key: AUTO_POST
        value: "1"
      - key: SCAN_SECONDS
        value: "120"
      - key: MIN_DEAL_SCORE
        value: "45"
